<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" fill="none">
  <defs>
    <radialGradient id="bgGlowApp" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#7A3FF2" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#1747E8" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orangeGlowApp" cx="80%" cy="80%" r="40%">
      <stop offset="0%" stop-color="#FF7A18" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#0B1020" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phoneBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3A4D7C"/>
      <stop offset="50%" stop-color="#1747E8"/>
      <stop offset="100%" stop-color="#7A3FF2"/>
    </linearGradient>
    <linearGradient id="appHeaderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1747E8"/>
      <stop offset="100%" stop-color="#7A3FF2"/>
    </linearGradient>
    <linearGradient id="cardGradApp" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#162244"/>
      <stop offset="100%" stop-color="#101932"/>
    </linearGradient>
    <filter id="phoneShadow" x="-20%" y="-15%" width="140%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="20" stdDeviation="25" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Deep Navy Studio Backdrop -->
  <rect width="800" height="450" fill="#0B1020"/>
  <rect width="800" height="450" fill="url(#bgGlowApp)"/>
  <rect width="800" height="450" fill="url(#orangeGlowApp)"/>

  <!-- Tech Geometric Orbits & Rings -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.2">
    <circle cx="400" cy="225" r="190" stroke-dasharray="6 6"/>
    <circle cx="400" cy="225" r="270"/>
  </g>

  <!-- Left Floating Metric Card -->
  <g transform="translate(130, 140)">
    <rect width="170" height="85" rx="12" fill="#0E162D" fill-opacity="0.9" stroke="#253560" stroke-width="1.2"/>
    <circle cx="32" cy="34" r="14" fill="#1747E8" fill-opacity="0.2"/>
    <!-- Android / Mobile Icon Symbol -->
    <path d="M26 36 L26 31 C26 28 30 26 32 26 C34 26 38 28 38 31 L38 36 Z" fill="#38BDF8"/>
    <rect x="58" y="24" width="70" height="6" rx="3" fill="#FFFFFF"/>
    <rect x="58" y="36" width="95" height="5" rx="2.5" fill="#6A7A9F"/>
    <rect x="20" y="60" width="130" height="6" rx="3" fill="#17213C"/>
    <rect x="20" y="60" width="95" height="6" rx="3" fill="url(#appHeaderGrad)"/>
  </g>

  <!-- Right Floating Metric Card -->
  <g transform="translate(500, 230)">
    <rect width="180" height="95" rx="12" fill="#0E162D" fill-opacity="0.9" stroke="#253560" stroke-width="1.2"/>
    <circle cx="35" cy="36" r="15" fill="#FF7A18" fill-opacity="0.2"/>
    <text x="35" y="41" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#FF7A18" text-anchor="middle">★</text>
    <rect x="62" y="26" width="60" height="7" rx="3.5" fill="#FFFFFF"/>
    <text x="62" y="48" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#22C55E">4.9 · Native Perf</text>
    <rect x="20" y="68" width="140" height="12" rx="6" fill="#17213C"/>
    <rect x="26" y="72" width="70" height="4" rx="2" fill="#7A3FF2"/>
    <circle cx="145" cy="74" r="3" fill="#FF7A18"/>
  </g>

  <!-- Central Smartphone Mockup -->
  <g filter="url(#phoneShadow)" transform="translate(290, 30)">
    <!-- Phone Outer Body / Chassis -->
    <rect x="0" y="0" width="220" height="390" rx="36" fill="#090E1C" stroke="url(#phoneBorder)" stroke-width="2.5"/>
    
    <!-- Phone Screen Bezel -->
    <rect x="8" y="8" width="204" height="374" rx="30" fill="#0D1326"/>

    <!-- Dynamic Island / Top Speaker & Camera -->
    <rect x="76" y="16" width="68" height="15" rx="7.5" fill="#000000"/>
    <circle cx="130" cy="23.5" r="3" fill="#141E38"/>

    <!-- App Screen UI -->
    <!-- App Header -->
    <g transform="translate(22, 44)">
      <circle cx="16" cy="16" r="16" fill="url(#appHeaderGrad)"/>
      <rect x="42" y="7" width="75" height="7" rx="3.5" fill="#FFFFFF"/>
      <rect x="42" y="19" width="48" height="5" rx="2.5" fill="#6A7A9F"/>
      <!-- Bell Notification -->
      <circle cx="152" cy="16" r="11" fill="#182342"/>
      <circle cx="157" cy="11" r="3" fill="#FF7A18"/>
    </g>

    <!-- Balance / Hero Feature Card -->
    <g transform="translate(20, 88)">
      <rect width="180" height="92" rx="16" fill="url(#appHeaderGrad)"/>
      <rect x="16" y="16" width="65" height="5" rx="2.5" fill="#FFFFFF" fill-opacity="0.8"/>
      <rect x="16" y="28" width="95" height="14" rx="4" fill="#FFFFFF"/>
      <!-- Action Buttons Row -->
      <g transform="translate(16, 54)">
        <rect width="42" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.25"/>
        <rect x="50" width="42" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.25"/>
        <rect x="100" width="42" height="24" rx="12" fill="#FFFFFF" fill-opacity="0.25"/>
      </g>
    </g>

    <!-- Quick Services / Features Section -->
    <g transform="translate(20, 192)">
      <rect x="0" y="0" width="85" height="70" rx="12" fill="#141D38" stroke="#25345E" stroke-width="1"/>
      <circle cx="24" cy="24" r="10" fill="#1747E8"/>
      <rect x="14" y="44" width="55" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="14" y="54" width="35" height="4" rx="2" fill="#6A7A9F"/>

      <rect x="95" y="0" width="85" height="70" rx="12" fill="#141D38" stroke="#25345E" stroke-width="1"/>
      <circle cx="119" cy="24" r="10" fill="#7A3FF2"/>
      <rect x="109" y="44" width="55" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="109" y="54" width="35" height="4" rx="2" fill="#6A7A9F"/>
    </g>

    <!-- Activity Feed Item -->
    <g transform="translate(20, 274)">
      <rect width="180" height="46" rx="12" fill="#121A33" stroke="#202D52" stroke-width="1"/>
      <circle cx="22" cy="23" r="11" fill="#FF7A18" fill-opacity="0.3"/>
      <rect x="42" y="15" width="70" height="6" rx="3" fill="#FFFFFF"/>
      <rect x="42" y="26" width="50" height="4" rx="2" fill="#6A7A9F"/>
      <rect x="135" y="18" width="32" height="10" rx="5" fill="#1747E8"/>
    </g>

    <!-- Bottom Tab Navigation Bar -->
    <g transform="translate(18, 332)">
      <rect width="184" height="34" rx="17" fill="#0A0E1C" stroke="#1D2A4F" stroke-width="1"/>
      <circle cx="28" cy="17" r="5" fill="#1747E8"/>
      <circle cx="72" cy="17" r="4" fill="#4B5A82"/>
      <circle cx="112" cy="17" r="4" fill="#4B5A82"/>
      <circle cx="156" cy="17" r="4" fill="#4B5A82"/>
    </g>

    <!-- Bottom Swipe Indicator Pill -->
    <rect x="75" y="372" width="70" height="3" rx="1.5" fill="#4B5A82"/>
  </g>
</svg>
