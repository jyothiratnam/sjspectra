<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#334155" stop-opacity="0.7"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="750" fill="url(#bgGrad)"/>
  
  <!-- Grid Lines -->
  <path d="M0 150 H1200 M0 300 H1200 M0 450 H1200 M0 600 H1200" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>
  <path d="M200 0 V750 M400 0 V750 M600 0 V750 M800 0 V750 M1000 0 V750" stroke="#334155" stroke-opacity="0.3" stroke-width="1"/>

  <!-- Glowing background elements -->
  <circle cx="600" cy="375" r="280" fill="#3b82f6" fill-opacity="0.08" filter="blur(60px)"/>
  <circle cx="400" cy="200" r="180" fill="#6366f1" fill-opacity="0.08" filter="blur(40px)"/>

  <!-- Browser Header Bar -->
  <rect x="150" y="80" width="900" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="180" cy="100" r="6" fill="#ef4444"/>
  <circle cx="200" cy="100" r="6" fill="#f59e0b"/>
  <circle cx="220" cy="100" r="6" fill="#10b981"/>
  <rect x="350" y="88" width="500" height="24" rx="12" fill="#0f172a"/>
  <text x="600" y="104" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">https://meeting-room.company.com/login</text>

  <!-- Login Card Window -->
  <rect x="150" y="120" width="900" height="550" fill="url(#cardGrad)" rx="0" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>

  <!-- Left Side Visual Panel -->
  <rect x="150" y="120" width="400" height="550" fill="#0f172a" fill-opacity="0.6"/>
  <circle cx="350" cy="300" r="120" fill="#2563eb" fill-opacity="0.15"/>
  
  <!-- Icon Graphics -->
  <rect x="310" y="260" width="80" height="80" rx="16" fill="#2563eb" fill-opacity="0.2" stroke="#3b82f6" stroke-width="2"/>
  <path d="M330 290 H370 M330 310 H355" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
  <circle cx="365" cy="310" r="4" fill="#60a5fa"/>

  <text x="350" y="390" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="22" text-anchor="middle">Enterprise Room Hub</text>
  <text x="350" y="420" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle">Spring Boot &amp; React Platform</text>

  <!-- Right Side Form Panel -->
  <text x="630" y="210" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="26">Sign In to Account</text>
  <text x="630" y="240" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">Enter your corporate credentials to manage bookings</text>

  <!-- Email Input -->
  <text x="630" y="290" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Corporate Email Address</text>
  <rect x="630" y="305" width="340" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="332" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">jyothi.ratnam@company.com</text>

  <!-- Password Input -->
  <text x="630" y="385" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Password</text>
  <rect x="630" y="400" width="340" height="44" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5"/>
  <text x="650" y="428" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">••••••••••••••••</text>

  <!-- Remember & Forgot -->
  <rect x="630" y="465" width="16" height="16" rx="4" fill="#2563eb"/>
  <path d="M634 473 L638 477 L643 469" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
  <text x="655" y="478" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Remember me</text>
  <text x="970" y="478" fill="#3b82f6" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="end">Forgot Password?</text>

  <!-- Submit Button -->
  <rect x="630" y="510" width="340" height="46" rx="8" fill="url(#btnGrad)"/>
  <text x="800" y="538" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="15" text-anchor="middle">Sign In to Dashboard →</text>

  <!-- Badge -->
  <rect x="630" y="580" width="340" height="32" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="650" cy="596" r="4" fill="#10b981"/>
  <text x="662" y="600" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Spring Security JWT Protected · Role-Based Access</text>
</svg>
