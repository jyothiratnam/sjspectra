<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="boxFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="boxBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311b92"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="650" fill="url(#bg)" rx="12"/>
  <rect x="20" y="20" width="1160" height="610" rx="12" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Title -->
  <text x="600" y="60" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="24" text-anchor="middle">Corporate Meeting Room Booking System — System Architecture</text>
  <text x="600" y="85" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" text-anchor="middle">Production End-to-End Architecture (Spring Boot 3 + React 18 + Aiven MySQL + Cloudflare R2)</text>

  <!-- Flow Boxes -->
  <!-- 1. Client Layer -->
  <g transform="translate(60, 150)">
    <rect width="200" height="380" rx="12" fill="url(#boxFront)" stroke="#3b82f6" stroke-width="2"/>
    <rect width="200" height="40" rx="12" fill="#2563eb"/>
    <text x="100" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" text-anchor="middle">FRONTEND CLIENT</text>
    <text x="100" y="80" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" text-anchor="middle">React 18 + TS</text>
    <text x="100" y="120" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">• Responsive UI</text>
    <text x="100" y="150" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">• Interactive Schedule</text>
    <text x="100" y="180" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">• Booking Form &amp; QR</text>
    <text x="100" y="210" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">• Real-Time Filters</text>
    <text x="100" y="240" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" text-anchor="middle">• Gemini AI Agenda Assist</text>
    
    <rect x="20" y="290" width="160" height="60" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="100" y="315" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Hosted on Vercel</text>
    <text x="100" y="335" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Global Edge CDN</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(270, 320)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#3b82f6" stroke-width="3" stroke-dasharray="6,4"/>
    <polygon points="60,-6 72,0 60,6" fill="#3b82f6"/>
    <text x="35" y="-12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">REST / HTTPS</text>
  </g>

  <!-- 2. Gateway / Reverse Proxy -->
  <g transform="translate(350, 220)">
    <rect width="160" height="240" rx="12" fill="url(#boxFront)" stroke="#10b981" stroke-width="2"/>
    <rect width="160" height="40" rx="12" fill="#059669"/>
    <text x="80" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="13" text-anchor="middle">GATEWAY &amp; PROXY</text>
    <text x="80" y="80" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" text-anchor="middle">NGINX</text>
    <text x="80" y="115" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• SSL/TLS Termination</text>
    <text x="80" y="140" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• CORS Routing</text>
    <text x="80" y="165" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Rate Limiting</text>
    <text x="80" y="190" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Gzip Compression</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(520, 320)">
    <line x1="0" y1="0" x2="60" y2="0" stroke="#10b981" stroke-width="3"/>
    <polygon points="60,-6 72,0 60,6" fill="#10b981"/>
    <text x="35" y="-12" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Port 8080</text>
  </g>

  <!-- 3. Backend Microservice -->
  <g transform="translate(590, 130)">
    <rect width="250" height="420" rx="12" fill="url(#boxFront)" stroke="#8b5cf6" stroke-width="2"/>
    <rect width="250" height="40" rx="12" fill="#7c3aed"/>
    <text x="125" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" text-anchor="middle">BACKEND APPLICATION</text>
    <text x="125" y="75" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="17" text-anchor="middle">Spring Boot 3 + Java 17</text>

    <!-- Internal Layers -->
    <rect x="20" y="95" width="210" height="45" rx="6" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1"/>
    <text x="125" y="122" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle">REST Controllers (Booking, Room, User)</text>

    <rect x="20" y="150" width="210" height="60" rx="6" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1"/>
    <text x="125" y="172" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Service Layer &amp; Validation</text>
    <text x="125" y="194" fill="#a78bfa" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Atomic Slot Collision Rules</text>

    <rect x="20" y="220" width="210" height="45" rx="6" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1"/>
    <text x="125" y="247" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Spring Security + JWT Auth</text>

    <rect x="20" y="275" width="210" height="45" rx="6" fill="#1e1b4b" stroke="#6d28d9" stroke-width="1"/>
    <text x="125" y="302" fill="#ddd6fe" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Spring Data JPA / Hibernate ORM</text>

    <rect x="20" y="335" width="210" height="65" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
    <text x="125" y="358" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">Deployed on Render Cloud</text>
    <text x="125" y="378" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="600" font-size="12" text-anchor="middle">Docker Containerized</text>
  </g>

  <!-- Arrow 3 Database -->
  <g transform="translate(850, 260)">
    <line x1="0" y1="0" x2="60" y2="-60" stroke="#f59e0b" stroke-width="3"/>
    <polygon points="60,-66 66,-50 50,-56" fill="#f59e0b"/>
    <text x="25" y="-40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">JDBC / HikariCP</text>
  </g>

  <!-- Arrow 4 Storage -->
  <g transform="translate(850, 380)">
    <line x1="0" y1="0" x2="60" y2="60" stroke="#06b6d4" stroke-width="3"/>
    <polygon points="60,66 50,56 66,50" fill="#06b6d4"/>
    <text x="25" y="45" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">AWS S3 SDK</text>
  </g>

  <!-- 4. Database Layer -->
  <g transform="translate(920, 120)">
    <rect width="210" height="180" rx="12" fill="url(#boxFront)" stroke="#f59e0b" stroke-width="2"/>
    <rect width="210" height="40" rx="12" fill="#d97706"/>
    <text x="105" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" text-anchor="middle">RELATIONAL DB</text>
    <text x="105" y="75" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" text-anchor="middle">MySQL (Aiven Cloud)</text>
    <text x="105" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• InnoDB Storage Engine</text>
    <text x="105" y="135" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Index-Optimized Queries</text>
    <text x="105" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Foreign Key Constraints</text>
  </g>

  <!-- 5. Cloud Storage -->
  <g transform="translate(920, 350)">
    <rect width="210" height="180" rx="12" fill="url(#boxFront)" stroke="#06b6d4" stroke-width="2"/>
    <rect width="210" height="40" rx="12" fill="#0891b2"/>
    <text x="105" y="26" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="14" text-anchor="middle">OBJECT STORAGE</text>
    <text x="105" y="75" fill="#22d3ee" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-weight="700" font-size="16" text-anchor="middle">Cloudflare R2 Storage</text>
    <text x="105" y="110" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Meeting Attachments</text>
    <text x="105" y="135" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Secure Pre-Signed URLs</text>
    <text x="105" y="160" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">• Local File Fallback</text>
  </g>

  <!-- Bottom Legend -->
  <rect x="60" y="580" width="1080" height="36" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
  <text x="600" y="603" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">Production Environment: High Availability Architecture with Automated Health Check Metrics and Zero Downtime Deployment</text>
</svg>
